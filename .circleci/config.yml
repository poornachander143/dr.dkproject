version: 2.1

executors:
  ruby-executor:
    docker:
      - image: circleci/ruby:3.1
      - image: selenium/standalone-chrome:latest
    working_directory: ~/project

jobs:
  run-tests:
    executor: ruby-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update && sudo apt-get install -y libnss3
            gem install bundler
            bundle install
      - run:
          name: Run Cucumber Feature File
          command: |
            cucumber features/hyperfiber.feature

workflows:
  version: 2
  test-workflow:
    jobs:
      - run-tests
