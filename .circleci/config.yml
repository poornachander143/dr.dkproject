version: 2.1

jobs:
  test:
    docker:
      - image: circleci/ruby:3.2  # Use the latest available version like 3.2
        environment:
          BUNDLE_JOBS: 4  # Speeds up bundle install
          BUNDLE_RETRY: 3

    steps:
      - checkout  # Check out your code

      - run:
          name: Set up Bundler and Cache Dependencies
          command: |
            bundle config set --local path vendor/bundle
            bundle install --jobs 4 --retry 3

      - run:
          name: Run Cucumber Tests
          command: bundle exec cucumber
          
workflows:
  version: 2
  test_workflow:
    jobs:
      - test
