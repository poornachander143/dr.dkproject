version: 2.1

jobs:
  test:
    docker:
      - image: ruby:3.3.4
        environment:
          DISPLAY: ":99"

    steps:
      - checkout

      - run:
          name: Check Directory Structure
          command: ls -R

      - run:
          name: Debug File Path
          command: |
            if [ ! -f features/pages/hyperfiberpage.rb ]; then
              echo "File not found: features/pages/hyperfiberpage.rb"
              exit 1
            else
              echo "File found: features/pages/hyperfiberpage.rb"
            fi

      - run:
          name: Install Dependencies
          command: bundle install --path vendor/bundle

      - run:
          name: Run Cucumber Tests
          command: bundle exec cucumber
