version: 2.1

executors:
  ruby-executor:
    docker:
      - image: circleci/ruby:3.1  # Replace with your Ruby version
        environment:
          BUNDLE_PATH: ~/.bundle

jobs:
  test:
    executor: ruby-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: bundle install
      - run:
          name: Run Cucumber Tests
          command: bundle exec cucumber --format pretty --format json --out cucumber_report.json features/

workflows:
  version: 2
  test-workflow:
    jobs:
      - test
