version: 2.1

executors:
  ruby-executor:
    docker:
      - image: cimg/ruby:3.1
        environment:
          BUNDLE_PATH: ~/.bundle

jobs:
  test:
    executor: ruby-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: bundle install
      - run:
          name: Run Cucumber Tests
          command: bundle exec cucumber features/drsignup.feature

workflows:
  version: 2
  test-workflow:
    jobs:
      - test
