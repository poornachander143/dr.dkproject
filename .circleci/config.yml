version: 2.1

jobs:
  test:
    docker:
      - image: ruby:3.3.4  # Use the official Ruby image
        environment:
          DISPLAY: ":99"  # Required for Selenium headless tests
      - image: selenium/standalone-chrome:latest  # Selenium container for Chrome browser

    steps:
      - checkout  # Checkout the code
      
      - run:
          name: Install Bundler
          command: gem install bundler

      - run:
          name: Install Dependencies
          command: bundle install

      - run:
          name: Run Cucumber Tests
          command: |
            bundle  cucumber features/google.feature

workflows:
  version: 2
  test_workflow:
    jobs:
      - test
