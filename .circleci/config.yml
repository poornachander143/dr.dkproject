version: 2.1

jobs:
  test:
    docker:
      - image: ruby:3.2-slim  # Use an appropriate Ruby image
    steps:
      - checkout
      - run:
          name: Install Bundler
          command: gem install bundler
      - run:
          name: Install Dependencies
          command: bundle install
      - run:
          name: Run Tests
          command: bundle exec cucumber

workflows:
  version: 2
  test_workflow:
    jobs:
      - test
